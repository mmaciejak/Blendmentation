[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blendmentation"
version = "0.6.0"
description = "Synthetic, augmented training datasets from Blender scenes"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Maciej Maciejak", email = "contact@csmx.eu" }]
keywords = ["blender", "synthetic data", "data augmentation", "computer vision", "dataset"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
# Blender bundles numpy with pip metadata (4.0: 1.23.5), so installing into Blender's python
# downloads nothing. bpy and OpenImageIO are bundled too but invisible to pip, a dependency on
# them would install a second copy (bpy is ~400 MB), so they are in the "module" extra
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/mmaciejak/Blendmentation"
Documentation = "https://blendmentation.docs.csmx.eu/"
Issues = "https://github.com/mmaciejak/Blendmentation/issues"

[project.optional-dependencies]
# blender as a python module, bpy supports one python version per release (5.1+: 3.13, 4.2-5.0: 3.11)
module = ["bpy", "OpenImageIO"]
test = ["pytest", "pycocotools"]
# type stubs for bpy, so editors show the blender types in the hints
dev = ["fake-bpy-module"]
# the documentation site, built with: mkdocs serve
# mkdocs 2 removes plugins (mkdocstrings), stay on 1.x; ruff formats the signatures
docs = ["mkdocs<2", "mkdocs-material", "mkdocstrings[python]", "mkdocs-glightbox", "ruff"]

[tool.setuptools.packages.find]
include = ["blendmentation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
