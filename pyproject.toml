[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blendmentation"
version = "0.11.0"
description = "Synthetic, augmented training datasets from Blender scenes"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Maciej Maciejak", email = "contact@csmx.eu" }]
keywords = ["blender", "synthetic data", "data augmentation", "computer vision", "dataset"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
# Blender bundles numpy with pip metadata, so installing into Blender's python
# downloads nothing. bpy and OpenImageIO are bundled too but invisible to pip, a dependency on
# them would install a second copy (bpy is ~400 MB), so they are in the "module" extra
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/mmaciejak/Blendmentation"
Documentation = "https://blendmentation.docs.csmx.eu/"
Issues = "https://github.com/mmaciejak/Blendmentation/issues"

[project.optional-dependencies]
# blender as a python module, bpy supports one python version per release (5.1+: 3.13, 4.2-5.0: 3.11)
module = ["bpy", "OpenImageIO"]
test = ["pytest", "pycocotools"]
# type stubs for bpy, so editors show the blender types in the hints, and the linter
dev = ["fake-bpy-module", "ruff"]
# the documentation site, built with: mkdocs serve
# mkdocs 2 removes plugins (mkdocstrings), stay on 1.x; ruff formats the signatures
docs = ["mkdocs<2", "mkdocs-material", "mkdocstrings[python]", "mkdocs-glightbox", "ruff"]

[tool.setuptools.packages.find]
include = ["blendmentation*"]

# the page template of export.augmentation_report
[tool.setuptools.package-data]
"blendmentation.export" = ["report.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# zip(strict=) would only add noise: the lengths are checked where they matter
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# long asserts read better on one line
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["blendmentation", "conftest"]
