[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "blendmentation"
version = "0.1.0"
description = "Synthetic, augmented training datasets from Blender scenes"
readme = "README.md"
requires-python = ">=3.10"
# inside blender bpy, numpy and OpenImageIO are bundled, nothing is needed
dependencies = []

[project.optional-dependencies]
# blender as a python module, bpy supports one python version per release (5.1+: 3.13, 4.2-5.0: 3.11)
module = ["bpy", "OpenImageIO"]
test = ["pytest", "pycocotools"]
# type stubs for bpy, so editors show the blender types in the hints
dev = ["fake-bpy-module"]

[tool.setuptools.packages.find]
include = ["blendmentation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
