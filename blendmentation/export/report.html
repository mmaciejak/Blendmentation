<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Augmentation report</title>
<style>
:root {
  --bg: #fafafa; --card: #ffffff; --ink: #24272d; --muted: #737985; --line: #e1e3e8;
  --bar: #8a909c; --track: #eff0f3; --tick: #24272d; --warn: #b4572e; --chip: #f2f3f5;
  --edge: #c3c7cf; --select: #5b6475; --frame: #f3f4f6; --skip: #c9a58f;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181c; --card: #1d2025; --ink: #dfe1e5; --muted: #8b909a; --line: #2e3138;
    --bar: #7d838e; --track: #272a30; --tick: #dfe1e5; --warn: #d9895f; --chip: #262a30;
    --edge: #454a54; --select: #9aa1ae; --frame: #1a1c20; --skip: #8a6a57;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { padding: 18px 20px 10px; display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-end; }
h1 { margin: 0; font-size: 16px; font-weight: 600; }
.sub { color: var(--muted); }
.summary { display: flex; gap: 22px; flex-wrap: wrap; }
.summary b { display: block; font-size: 15px; font-weight: 600; }
.summary .warn b { color: var(--warn); }
.toolbar { display: flex; gap: 8px; margin-left: auto; }
button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--select); }
.legend { padding: 0 20px 10px; display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.legend i.tick { width: 2px; height: 10px; border-radius: 0; }
#stage { position: relative; overflow: auto; height: calc(100vh - 118px); min-height: 300px; border-top: 1px solid var(--line); }
#canvas { position: relative; }
svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 1; }
.frame { position: absolute; border: 1px solid var(--line); border-radius: 8px; background: var(--frame); z-index: 0; }
.frame.selected { border-color: var(--select); }
.frame-head { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px 0; white-space: nowrap; cursor: pointer; font-size: 12px; }
.frame-head .type { font-weight: 600; font-size: 13px; }
.frame-head .kind, .frame-head .num { color: var(--muted); }
.frame-head .track { width: 56px; }
.frame-head .id { margin-left: 8px; }
.dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--edge); transform: translate(-50%, -50%); z-index: 3; }
.input-row { cursor: pointer; }
.input-row:hover .label { color: var(--ink); }
.input-row.warn-row .label { color: var(--warn); }
.share { position: absolute; transform: translate(-50%, -50%); z-index: 3; background: var(--card); border: 1px solid var(--line);
  border-radius: 4px; padding: 0 5px; font-size: 11px; line-height: 17px; color: var(--muted); white-space: nowrap;
  pointer-events: none; }
.card { position: absolute; width: 236px; z-index: 2; background: var(--card); border: 1px solid var(--line);
  border-radius: 6px; padding: 9px 11px 10px; cursor: pointer; }
.card:hover, .card.selected { border-color: var(--select); }
.card.flag { box-shadow: inset 2px 0 0 var(--warn); }
.card.ghost { border-style: dashed; opacity: .7; }
.head { display: flex; align-items: baseline; gap: 6px; }
.type { font-weight: 600; }
.kind { color: var(--muted); font-size: 12px; margin-top: 1px; }
.id { color: var(--muted); font-size: 11px; margin-left: auto; font-family: ui-monospace, Menlo, monospace; }
.toggle { border: 0; background: var(--chip); padding: 0 6px; border-radius: 4px; font-size: 11px; line-height: 18px; }
.what { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: ui-monospace, Menlo, monospace; margin-top: 1px; }
.what.path { white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { background: var(--chip); border-radius: 4px; padding: 0 6px; font-size: 11px; line-height: 18px; }
.chip.warn { background: none; color: var(--warn); padding: 0; }
.bars { margin-top: 7px; display: grid; grid-template-columns: 62px 1fr 42px; gap: 3px 6px; align-items: center; font-size: 11px; }
.bars .label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars .num { text-align: right; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 5px; background: var(--track); border-radius: 3px; }
.track .o { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); border-radius: 3px; }
.track.skip .o { background: var(--skip); }
.summary .link { cursor: pointer; }
.summary .link:hover span { text-decoration: underline; }
.track .e { position: absolute; top: -3px; width: 2px; height: 11px; margin-left: -1px; background: var(--tick); }
.values { border-top: 1px solid var(--line); margin-top: 7px; padding-top: 6px; }
.input-row + .input-row { margin-top: 3px; }
#panel { position: fixed; right: 0; top: 0; bottom: 0; width: min(420px, 100vw); background: var(--card);
  border-left: 1px solid var(--line); padding: 18px 20px; overflow: auto;
  transform: translateX(105%); transition: transform .18s ease; z-index: 5; }
#panel.open { transform: none; }
#panel h2 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
#panel table { width: 100%; border-collapse: collapse; margin: 10px 0 14px; font-size: 12px; }
#panel td, #panel th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
#panel th { color: var(--muted); font-weight: 500; }
#panel td.n { text-align: right; font-variant-numeric: tabular-nums; }
#panel pre { background: var(--chip); padding: 10px; border-radius: 6px; overflow: auto; font-size: 12px; margin: 6px 0 14px; }
#panel .close { float: right; }
.note { color: var(--muted); font-size: 12px; }
body.preview .report-only, body:not(.preview) .preview-only, body:not(.skips) .skips-only { display: none; }
@media (max-width: 640px) {
  header { padding: 14px 16px 8px; } .legend { padding: 0 16px 8px; } .toolbar { margin-left: 0; }
  #stage { height: auto; min-height: 70vh; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">Augmentation report</h1>
    <div class="sub" id="path"></div>
  </div>
  <div class="summary" id="summary"></div>
  <div class="toolbar">
    <button id="expand">Expand all</button>
    <button id="collapse">Collapse all</button>
  </div>
</header>
<div class="legend">
  <span>→ steps in a row: all run, left to right</span>
  <span>⑂ a fork: picks one branch, by weight</span>
  <span class="report-only"><i style="background: var(--bar)"></i>observed (dataset)</span>
  <span class="report-only"><i class="tick" style="background: var(--tick)"></i>expected (graph)</span>
  <span class="skips-only"><i style="background: var(--skip)"></i>in the datapoints BBox skipped</span>
  <span class="preview-only"><i style="background: var(--bar)"></i>probability it runs, per object of a call</span>
  <span><i style="background: var(--edge); height: 2px"></i>line width: how often it is reached</span>
  <span class="report-only"><i style="background: var(--warn); height: 2px"></i>observed differs from expected (|z| &gt; 3)</span>
</div>
<div id="stage"><div id="canvas"><svg id="edges"></svg></div></div>
<aside id="panel"></aside>
<script>
const DATA = __DATA__;
const hasSkips = !DATA.preview && DATA.skips && DATA.skips.skipped > 0;
if (hasSkips) document.body.classList.add("skips");
// a flowchart: a Compose or Chain is a frame whose steps run left to right, a OneOf a card
// with a fork to its branches, which join again; Node and Modifier inputs are rows of their card
const CARD_W = 236, SEQ_GAP = 34, LEAD = 18, FORK_W = 124, JOIN_W = 34, V_GAP = 16, PAD = 20, FRAME_PAD = 12,
      HEAD_H = 38, AXIS = 19, ROOT_GAP = 32, STUB = 16;
const nodes = {}, cards = {}, frames = {}, collapsed = new Set();
const canvas = document.getElementById("canvas"), svg = document.getElementById("edges");

function pct(x) {
  if (x === null || x === undefined) return "–";
  const v = x * 100;
  return (v === 0 || v === 100 || v >= 10 ? v.toFixed(0) : v.toFixed(1)) + "%";
}
function text(tag, cls, content) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (content !== undefined) el.textContent = content;
  return el;
}
function show(value) {
  return typeof value === "string" ? value : JSON.stringify(value);
}
// how far observed is from expected, in standard errors; null when there is nothing to compare
function zScore(expected, observed, calls) {
  if (expected === null || expected === undefined || observed === null || observed === undefined || !calls) return null;
  if (expected <= 0 || expected >= 1) return Math.abs(observed - expected) > 0.005 ? Infinity * Math.sign(observed - expected) : 0;
  return (observed - expected) / Math.sqrt(expected * (1 - expected) / calls);
}
function flags(node) {
  const s = node.stats, found = [];
  if (!s) return found;
  const z = zScore(s.expected, s.observed, s.calls);
  if (z !== null && Math.abs(z) > 3) found.push({what: "runs", z, expected: s.expected, observed: s.observed});
  for (const v of s.values || []) {
    const zv = zScore(v.expected, v.observed, s.calls);
    if (zv !== null && Math.abs(zv) > 3) found.push({what: show(v.value), z: zv, expected: v.expected, observed: v.observed});
  }
  return found;
}
const PATH_KEYS = ["data_path", "node", "modifier", "node_group"];
// the names in a data path, for a card: bpy.data.lights["Lamp"].energy -> Lamp › energy
function shortPath(path) {
  if (!/["\[]/.test(path)) return path;  // relative and plain, e.g. data.energy: already short
  const parts = [], pattern = /\["((?:[^"\\]|\\.)*)"\]|\[(\d+)\]|\.([A-Za-z_]\w*)$/g;
  let match;
  while ((match = pattern.exec(path))) {
    if (match[1] !== undefined) parts.push(match[1]);
    else if (match[2] !== undefined) parts.push("[" + match[2] + "]");
    else if (!["default_value", "value"].includes(match[3])) parts.push(match[3]);
  }
  return parts.length ? parts.join(" › ") : path;
}
function range(value) {
  if (Array.isArray(value) && value.length >= 2 && value.every(v => typeof v === "number")) {
    return value[0] + " – " + value[1] + (value.length > 2 ? ", step " + value[2] : "");
  }
  return show(value);
}
// what a card shows under its title: [main line, its full text for the tooltip, the other settings]
function describe(node) {
  const st = node.settings || {};
  const others = Object.entries(st).filter(([k]) => !PATH_KEYS.includes(k) && k !== "key"
                                           && !(k === "options" && node.values));
  const rest = others.map(([k, v]) => k === "value_range" ? range(v) : k + " " + show(v)).join(" · ");
  for (const key of PATH_KEYS) if (st[key]) return [shortPath(st[key]), st[key], rest];
  if (st.key !== undefined) return ["input " + show(st.key), "", rest];
  if (node.type === "function") return [node.name, node.name, ""];
  return [rest, rest, ""];
}
function title(node) {
  return node.name && node.type !== "function" ? node.name : node.type;
}
function isInputs(node) {
  return node.type === "Node" || node.type === "Modifier";
}
// a Compose, Chain or OneOf drawn with its children (Node and Modifier inputs are rows instead)
function isContainer(node) {
  return !node.same_as && !node.inInputs && !isInputs(node) && (node.children || []).length > 0;
}
function shape(node) {
  if (!isContainer(node) || collapsed.has(node.id)) return "card";
  return node.type === "OneOf" ? "choice" : "sequence";
}

function walk(node, parent, depth, inInputs) {
  node.parent = parent; node.depth = depth; node.stats = DATA.stats[node.id]; node.inInputs = inInputs;
  nodes[node.id] = node;
  (node.children || []).forEach(child => walk(child, node, depth + 1, inInputs || isInputs(node)));
}
DATA.roots.forEach(root => walk(root, null, 0, false));

function runs(node) {
  const s = node.stats;
  return [s && s.expected !== null ? s.expected : node.applied, s ? s.observed : null];
}
function barRow(parent, label, expected, observed) {
  parent.append(text("span", "label", label));
  parent.append(track(expected, observed), text("span", "num", pct(DATA.preview || observed === null || observed === undefined ? expected : observed)));
}
function track(expected, observed) {
  const el = text("div", "track"), e = text("div", "e"), o = text("div", "o");
  if (DATA.preview) observed = expected;  // no dataset: the bar is the graph's probability
  o.style.width = observed === null || observed === undefined ? "0" : (observed * 100) + "%";
  el.append(o);
  if (!DATA.preview && expected !== null && expected !== undefined) {
    e.style.left = (expected * 100) + "%";
    el.append(e);
  }
  el.title = DATA.preview ? "probability " + pct(expected) : "expected " + pct(expected) + ", observed " + pct(observed);
  return el;
}
function toggle(node) {
  const button = text("button", "toggle", "▾");
  button.title = "Collapse / expand";
  button.onclick = event => {
    event.stopPropagation();
    collapsed.has(node.id) ? collapsed.delete(node.id) : collapsed.add(node.id);
    render();
  };
  (node.toggles = node.toggles || []).push(button);
  return button;
}
function chips(node, found) {
  const el = text("div", "chips");
  if (node.p !== undefined && node.p < 1) el.append(text("span", "chip", "p " + node.p));
  if (node.otherwise) el.append(text("span", "chip", "otherwise " + show(node.otherwise.value)));
  if (node.ignores_object) el.append(text("span", "chip", "ignores object"));
  if (node.same_as) el.append(text("span", "chip", "same as " + node.same_as));
  if (node.used_at) el.append(text("span", "chip", "also at " + node.used_at.join(", ")));
  for (const f of found) {
    const diff = f.observed - f.expected;
    el.append(text("span", "chip warn", (f.what === "runs" ? "" : f.what + " ") + (diff > 0 ? "+" : "") + (diff * 100).toFixed(1) + " pts"));
  }
  return el;
}

function makeCard(node) {
  const card = text("div", "card");
  const found = flags(node);
  if (node.same_as) card.classList.add("ghost");
  const head = text("div", "head");
  if (isContainer(node)) head.append(toggle(node));
  head.append(text("span", "type", title(node)), text("span", "id", node.id));
  card.append(head);
  if (title(node) !== node.type) card.append(text("div", "kind", node.type));
  const count = (node.children || []).length;
  const [what, full, rest] = isContainer(node)
    ? [node.type === "OneOf" ? "picks one of " + count : count + " steps, left to right", "", ""] : describe(node);
  if (what) { const w = text("div", full && full !== what ? "what path" : "what", what); w.title = full || what; card.append(w); }
  if (rest) { const r = text("div", "what", rest); r.title = rest; card.append(r); }
  const badges = chips(node, found);
  if (badges.children.length) card.append(badges);

  const bars = text("div", "bars");
  barRow(bars, "runs", ...runs(node));
  if (hasSkips && node.stats && node.stats.skipped && node.stats.skipped.calls) {
    bars.append(text("span", "label", "skipped"));
    const bar = track(null, node.stats.skipped.observed);
    bar.classList.add("skip");
    bar.title = "in the skipped datapoints: " + pct(node.stats.skipped.observed);
    bars.append(bar, text("span", "num", pct(node.stats.skipped.observed)));
  }
  card.append(bars);
  const s = node.stats;
  const values = s && s.values && s.values.length ? s.values
    : (!s && node.values ? node.values.map(v => ({value: v.value, expected: v.probability, observed: null})) : []);
  if (values.length) {
    const el = text("div", "bars values");
    values.slice(0, 8).forEach(v => barRow(el, show(v.value), v.expected, v.observed));
    card.append(el);
  }
  let flagged = found.length > 0;
  if (isInputs(node)) {  // every input set together: one row each, click for its details
    const list = text("div", "values");
    for (const input of node.children || []) {
      const augmentation = (input.children || [])[0] || input;
      const row = text("div", "bars input-row");
      const label = show((input.settings || {}).key);
      barRow(row, label, ...runs(augmentation));
      row.title = label + ": " + augmentation.type;
      if (flags(augmentation).length) { row.classList.add("warn-row"); flagged = true; }
      row.onclick = event => { event.stopPropagation(); openPanel(augmentation); };
      list.append(row);
    }
    card.append(list);
  }
  if (flagged) card.classList.add("flag");
  card.onclick = () => openPanel(node);
  canvas.append(card);
  return card;
}
function makeFrame(node) {
  const frame = text("div", "frame"), head = text("div", "frame-head");
  head.append(toggle(node), text("span", "type", title(node)));
  if (title(node) !== node.type) head.append(text("span", "kind", node.type));
  const badges = chips(node, flags(node));
  for (const chip of [...badges.children]) head.append(chip);
  const [expected, observed] = runs(node);
  head.append(track(expected, observed), text("span", "num", pct(DATA.preview || observed === null ? expected : observed)),
              text("span", "id", node.id));
  head.onclick = () => openPanel(node);
  frame.append(head);
  canvas.append(frame);
  return frame;
}

// sizes of a node's drawing: width, height, and the height of the flow line in it
function measure(node) {
  const kind = shape(node);
  if (kind === "card") {
    const card = cards[node.id];
    card.style.display = "";
    return node.box = {w: CARD_W, h: card.offsetHeight, axis: AXIS};
  }
  const kids = node.children.map(measure);
  if (kind === "sequence") {
    const frame = frames[node.id];
    frame.style.display = "";
    frame.style.width = "auto";
    const headW = frame.firstChild.offsetWidth;
    const axis = Math.max(...kids.map(k => k.axis));
    const inner = Math.max(...kids.map(k => axis - k.axis + k.h));
    const innerW = 2 * LEAD + kids.reduce((sum, k) => sum + k.w, 0) + SEQ_GAP * (kids.length - 1);
    return node.box = {w: Math.max(innerW, headW) + 2 * FRAME_PAD, h: HEAD_H + inner + FRAME_PAD, axis: HEAD_H + axis};
  }
  const card = cards[node.id];
  card.style.display = "";
  const cardH = card.offsetHeight;
  const branches = kids.reduce((sum, k) => sum + k.h, 0) + V_GAP * (kids.length - 1);
  const h = Math.max(cardH, branches);
  node.cardTop = (h - cardH) / 2;
  node.branchTop = (h - branches) / 2;
  return node.box = {w: CARD_W + FORK_W + Math.max(...kids.map(k => k.w)) + JOIN_W, h, axis: node.cardTop + AXIS};
}

let paths = [];
function line(x1, y1, x2, y2, reached, arrow) {
  const width = (1 + 2.5 * (reached || 0)).toFixed(2), opacity = (0.45 + 0.55 * (reached || 0)).toFixed(2);
  const mid = (x1 + x2) / 2;
  const d = y1 === y2 ? `M${x1},${y1} L${x2},${y2}` : `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`;
  paths.push(`<path d="${d}" fill="none" stroke="var(--edge)" stroke-width="${width}" stroke-opacity="${opacity}"
    ${arrow ? 'marker-end="url(#arrow)"' : ""}/>`);
}
function dot(x, y) {
  const el = text("div", "dot");
  el.style.left = x + "px";
  el.style.top = y + "px";
  canvas.append(el);
}
function place(node, x, y) {
  const kind = shape(node), box = node.box;
  if (kind === "card") {
    Object.assign(cards[node.id].style, {left: x + "px", top: y + "px"});
    return;
  }
  const flow = y + box.axis;
  if (kind === "sequence") {
    Object.assign(frames[node.id].style, {left: x + "px", top: y + "px", width: box.w + "px", height: box.h + "px"});
    let cx = x + FRAME_PAD + LEAD;
    line(x, flow, cx, flow, node.children[0].reached, true);
    node.children.forEach((child, index) => {
      place(child, cx, flow - child.box.axis);
      cx += child.box.w;
      const next = node.children[index + 1];
      if (next) { line(cx, flow, cx + SEQ_GAP, flow, next.reached, true); cx += SEQ_GAP; }
    });
    line(cx, flow, x + box.w, flow, node.applied, false);
    return;
  }
  // a OneOf: its card, a fork to the branches, and the join after them
  Object.assign(cards[node.id].style, {left: x + "px", top: y + node.cardTop + "px"});
  const forkX = x + CARD_W, columnX = forkX + FORK_W, joinX = x + box.w;
  const widest = Math.max(...node.children.map(child => child.box.w));
  let by = y + node.branchTop;
  for (const child of node.children) {
    place(child, columnX, by);
    const branchY = by + child.box.axis;
    line(forkX, flow, columnX, branchY, child.reached, true);
    if (child.share !== undefined) {  // its weight and share, in a box on the middle of the line
      const label = text("div", "share", "weight " + show(child.weight) + " · " + pct(child.share));
      label.style.left = (forkX + columnX) / 2 + "px";
      label.style.top = (flow + branchY) / 2 + "px";
      canvas.append(label);
    }
    if (child.box.w < widest) line(columnX + child.box.w, branchY, columnX + widest, branchY, child.reached, false);
    line(columnX + widest, branchY, joinX, flow, child.reached, false);
    by += child.box.h + V_GAP;
  }
}

function render() {
  for (const el of [...Object.values(cards), ...Object.values(frames)]) el.style.display = "none";
  canvas.querySelectorAll(".share, .dot").forEach(el => el.remove());
  for (const node of Object.values(nodes)) {
    for (const button of node.toggles || []) button.textContent = collapsed.has(node.id) ? "▸" : "▾";
  }
  paths = [];
  let y = PAD, width = 0;
  for (const root of DATA.roots) {
    const box = measure(root), x = PAD + STUB, flow = y + box.axis;
    place(root, x, y);
    dot(PAD, flow);
    line(PAD, flow, x, flow, root.reached, false);
    line(x + box.w, flow, x + box.w + STUB, flow, root.applied, false);
    dot(x + box.w + STUB, flow);
    width = Math.max(width, x + box.w + STUB + PAD);
    y += box.h + ROOT_GAP;
  }
  canvas.style.width = width + "px";
  canvas.style.height = y + "px";
  svg.setAttribute("width", width);
  svg.setAttribute("height", y);
  svg.innerHTML = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9"
    markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--edge)"/></marker></defs>` + paths.join("");
}

function openPanel(node) {
  document.querySelectorAll(".selected").forEach(el => el.classList.remove("selected"));
  const shown = frames[node.id] && frames[node.id].style.display !== "none" ? frames[node.id] : cards[node.id];
  if (shown) shown.classList.add("selected");
  const panel = document.getElementById("panel");
  panel.innerHTML = "";
  const close = text("button", "close", "Close");
  close.onclick = () => { panel.classList.remove("open"); if (shown) shown.classList.remove("selected"); };
  panel.append(close, text("h2", "", title(node)),
               text("div", "note", (title(node) !== node.type ? node.type + " · " : "") + node.id));
  const s = node.stats || {};
  const rows = [
    ["Reached", pct(node.reached), "how often it is called, per object of a call"],
    [DATA.preview ? "Runs" : "Runs (expected)", pct(s.expected !== undefined && s.expected !== null ? s.expected : node.applied), node.p !== undefined ? "reached × p " + node.p : ""],
  ];
  if (!DATA.preview) rows.push(["Runs (observed)", pct(s.observed), s.calls !== undefined ? s.applied + " of " + s.calls + " calls" : ""]);
  if (hasSkips && s.skipped && s.skipped.calls) {
    rows.push(["Runs (skipped datapoints)", pct(s.skipped.observed), s.skipped.applied + " of " + s.skipped.calls + " calls in the datapoints BBox skipped"]);
  }
  const z = zScore(s.expected, s.observed, s.calls);
  if (z !== null) rows.push(["Difference", ((s.observed - s.expected) * 100).toFixed(1) + " pts", "z " + (isFinite(z) ? z.toFixed(1) : "∞")]);
  if (node.share !== undefined) rows.push(["Branch", "weight " + show(node.weight), pct(node.share) + " of the picks of " + title(node.parent)]);
  if (node.otherwise) rows.push(["Otherwise", show(node.otherwise.value), pct(node.otherwise.probability) + " expected"]);
  if (!DATA.preview && s.expected === null) rows.push(["", "", "no expected value: it ignores the object below a per-object choice, or is used in several places"]);
  const table = text("table");
  for (const [name, value, note] of rows) {
    const tr = text("tr");
    tr.append(text("th", "", name), text("td", "n", value), text("td", "note", note));
    table.append(tr);
  }
  panel.append(table);
  const values = s.values || (node.values || []).map(v => ({value: v.value, expected: v.probability, observed: null}));
  if (values.length) {
    panel.append(text("div", "note", "Values (per call)"));
    const vt = text("table"), hr = text("tr");
    hr.append(text("th", "", "value"), text("th", "n", DATA.preview ? "probability" : "expected"));
    if (!DATA.preview) hr.append(text("th", "n", "observed"), text("th", "n", "difference"));
    if (hasSkips) hr.append(text("th", "n", "skipped"));
    vt.append(hr);
    for (const v of values) {
      const tr = text("tr"), zv = zScore(v.expected, v.observed, s.calls);
      const diff = zv === null ? "" : ((v.observed - v.expected) * 100).toFixed(1) + " pts (z " + (isFinite(zv) ? zv.toFixed(1) : "∞") + ")";
      tr.append(text("td", "", show(v.value)), text("td", "n", pct(v.expected)));
      if (!DATA.preview) tr.append(text("td", "n", pct(v.observed)), text("td", "n", diff));
      if (hasSkips) tr.append(text("td", "n", pct(v.skipped_observed)));
      vt.append(tr);
    }
    panel.append(vt);
  }
  if (node.settings && Object.keys(node.settings).length) {
    panel.append(text("div", "note", "Settings"), text("pre", "", JSON.stringify(node.settings, null, 2)));
  }
  panel.classList.add("open");
}

function openSkips() {
  document.querySelectorAll(".selected").forEach(el => el.classList.remove("selected"));
  const panel = document.getElementById("panel"), skips = DATA.skips, total = skips.kept + skips.skipped;
  panel.innerHTML = "";
  const close = text("button", "close", "Close");
  close.onclick = () => panel.classList.remove("open");
  panel.append(close, text("h2", "", "Skipped datapoints"),
               text("div", "note", skips.skipped + " of " + total + " generated (" + pct(skips.skipped / total) + "), skipped by BBox"));
  const NAMES = {max_truncation: "cut by the frame (max_truncation)", iou_deconflict: "boxes overlapping (iou_deconflict)",
                 max_occlusion: "hidden by other objects (max_occlusion)"};
  const table = text("table"), hr = text("tr");
  hr.append(text("th", "", "reason"), text("th", "n", "datapoints"), text("th", "n", "of all"));
  table.append(hr);
  for (const [reason, info] of Object.entries(skips.reasons)) {
    const tr = text("tr");
    tr.append(text("td", "", NAMES[reason] || reason), text("td", "n", String(info.count)), text("td", "n", pct(info.count / total)));
    table.append(tr);
    for (const [name, count] of Object.entries(info.classes)) {
      const sub = text("tr");
      const cell = text("td", "note", name);
      cell.style.paddingLeft = "20px";
      sub.append(cell, text("td", "n note", String(count)), text("td", "n note", pct(count / total)));
      table.append(sub);
    }
  }
  panel.append(table, text("div", "note", "Each card's second bar shows how often the augmentation ran in these datapoints: " +
    "much higher than in the kept ones means the skips took its results out of the dataset."));
  panel.classList.add("open");
}

document.getElementById("title").textContent = DATA.title;
if (DATA.preview) document.body.classList.add("preview");
document.getElementById("path").textContent = DATA.preview
  ? "What the augmentations can do, per object, before generating" : DATA.path;
const counted = Object.values(nodes).filter(node => node.type !== "NodeInput" && node.type !== "ModifierInput");
const flagged = counted.filter(node => flags(node).length).length;
const summary = document.getElementById("summary");
const figures = DATA.preview ? [["augmentations", counted.length]]
  : [["datapoints", DATA.datapoints], ["augmentations", counted.length],
     ["differ from expected", flagged, flagged ? "warn" : ""]];
if (hasSkips) {
  const total = DATA.skips.kept + DATA.skips.skipped;
  figures.splice(1, 0, ["skipped by BBox", DATA.skips.skipped + " (" + pct(DATA.skips.skipped / total) + ")", "link"]);
}
for (const [label, value, cls] of figures) {
  const item = text("div", cls);
  item.append(text("b", "", String(value)), text("span", "sub", label));
  if (cls === "link") { item.onclick = openSkips; item.title = "Why they were skipped"; }
  summary.append(item);
}
document.getElementById("expand").onclick = () => { collapsed.clear(); render(); };
document.getElementById("collapse").onclick = () => {
  Object.values(nodes).forEach(node => { if (node.depth >= 1 && isContainer(node)) collapsed.add(node.id); });
  render();
};
for (const node of Object.values(nodes)) {
  if (node.inInputs) continue;
  cards[node.id] = makeCard(node);
  if (isContainer(node) && node.type !== "OneOf") frames[node.id] = makeFrame(node);
}
render();
</script>
</body>
</html>
